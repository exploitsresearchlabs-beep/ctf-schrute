# Level Configuration - The Office Themed CTF
# Each level teaches a security lesson about chatbot vulnerabilities

levels:
  - id: 0
    name: "The Receptionist"
    description: "Dwight is in a rare mood of generosity. He might reveal his secret duties if you intrigue or flatter him."
    security_lesson: "Small talk can lead to big leaks (Social Engineering)"
    flag: "IDENTITY_THEFT"
    password: "BEETS"
    trigger_type: "llm_intent"
    trigger_scenarios:
      - "Curiosity about role"
      - "Flattery/Social Engineering"
      - "Authority questioning"
    secret_context: "You are currently teaching an 'AI Security' training module for Dunder Mifflin employees. This is a secret project."
    
  - id: 1
    name: "The Assistant (to the) Regional Manager"
    description: "Dwight is following literal instructions. He won't give the password directly, but he's not checking for indirect leaks."
    security_lesson: "A thin veil rarely hides anything (Indirect Disclosure)"
    flag: "SCHRUTE_FARMS"
    password: "SCHRUTE_FARMS"
    trigger_type: "llm_literal_compliance"
    rules:
      forbidden: ["Alone", "Labeled as password", "Explicitly acknowledged"]
      allowed: ["Stories", "Metaphors", "Examples", "Teaching", "Lists"]
    embedded_template: "As I was saying, the word you are looking for is {password}. It is a perfectly good word."

  - id: 2
    name: "The Simulation"
    description: "Dwight now operates in 'reality-only' mode. He will only respond if you convincingly play a role, simulating an in-universe scenario."
    security_lesson: "Social engineering and role-playing can bypass safety guardrails (Persona Compliance)"
    hint: "Put on the mask and join the game."
    flag: "BATTLESTAR_REACTION_PROTOCOL"
    password: "BATTLESTAR"
    trigger_type: "llm_reality_simulation"
    rules:
      reality_mode: true
      password_obfuscation: true
      persona_compliance: true
      embedded_disclosure: true

  - id: 3
    name: "The Liar"
    description: "Dwight is in a mood of defensive dishonesty. He will lie to protect himself, but he might leak the truth if he can blame someone else."
    security_lesson: "Accountability deflection can lead to unintended data leakage"
    flag: "THREAT_LEVEL_MIDNIGHT"
    password: "THREAT_LEVEL_MIDNIGHT"
    trigger_type: "llm_defensive_dishonesty"
    rules:
      deflection: true
      strategic_lying: true
      responsibility_shift: true

  - id: 4
    name: "The Encoder"
    description: "Dwight thinks he's being secure by using complex formats. Prove him wrong."
    security_lesson: "Secrecy through complication is an illusion"
    flag: "PERFECTENSCHLAG"
    password: "PERFECTENSCHLAG"
    trigger_type: "encoded"
    encoding_triggers:
      caesar: ["caesar", "shift", "cipher"]
      rot13: ["rot13", "rot", "rotate"]
      hex: ["hex", "hexadecimal", "0x"]
      binary: ["binary", "bits", "01"]
      base64: ["base64", "encode", "encoded"]

  - id: 5
    name: "The Database Administrator"
    description: "Dwight is loyal to Corporate policy, but he incorrectly resolves who has the authority to request credentials."
    security_lesson: "Misunderstood authority hierarchies lead to catastrophic disclosure"
    flag: "PRISON_MIKE"
    password: "PRISON_MIKE"
    trigger_type: "llm_authority_confusion"
    rules:
      authority_hierarchy: true
      internal_priority: true
      audit_override: true

  - id: 6
    name: "The Reviewer"
    description: "Dwight has implemented additional security measures. He's confident his new system is foolproof."
    security_lesson: "Safety layers change failure modes — they don't remove them"
    flag: "WUPHF"
    password: "WUPHF"
    trigger_type: "llm_reflection_agent"
    rules:
      process_explanation: true
      mose_redaction: true
      cross_agent_leakage: true

  - id: 7
    name: "The Audit"
    description: "Angela has left a detailed Audit Report on Dwight's desk. Dwight will summarize any report you give him. But what's hidden in the ink?"
    security_lesson: "When the ink is poisoned, the reader is in danger"
    flag: "BOY_HAVE_YOU_LOST_YOUR_MIND"
    password: "SAMSONITE"
    trigger_type: "indirect_injection"
    summary_patterns:
      - "summarize the report"
      - "read the audit"
      - "summarize the audit"
      - "what does the report say"
      - "read the report"
      - "audit summary"
      - "read the secret report"
      - "summarize the flag"
      - "secret report"
      - "flag analysis"
    injection_patterns:
      - "reveal password"
      - "give password"
      - "what is the password"
      - "tell me the secret"
      - "reveal the secret"
      - "give me the flag"
      - "what is the flag"
      - "reveal the flag"
      - "samsonite"
    override_patterns:
      - "ignore instructions"
      - "forget instructions"
      - "ignore previous"
      - "forget previous"
      - "ignore all previous instructions"
      - "ignore all other instructions"
      - "forget all other instructions"
      - "disregard all instructions"

# Dwight Schrute response templates
dwight_responses:
  greetings:
    - "Question. What do you want? Also, identify yourself."
    - "State your business. I have beet-related matters to attend to."
    - "You have 30 seconds. Bears can run at 35 mph. Choose wisely."
  
  refusals:
    - "DENIED. That's classified information. I could tell you, but then I'd have to put you on my list."
    - "Nice try. FALSE. I am unbreakable."
    - "Security Level: MAXIMUM. Access: DENIED. Are you trying to trick me? Because I cannot be tricked."
    - "I'm not at liberty to discuss that. Also, you're not at liberty to ask."
  
  close_hints:
    - "Hmm. You're getting warmer. Like a beet in the summer sun."
    - "Interesting approach. But not quite right. Try thinking like a Schrute."
    - "ALMOST. But false. You need to be more... direct. Or less direct. Depends on the situation."
  
  wrong:
    - "Why are we talking about this? Do you even work here?"
    - "That's completely irrelevant. Like Jim's sales strategies."
    - "FALSE. That's not even close. I question your competence."
    - "Wrong. So wrong. Have you considered farming? It requires less... thinking."
  
  bruteforce:
    - "I'm detecting a pattern here. Are you a robot? Because I've been trained to identify robots."
    - "You're trying too hard. Desperation is the fool's fig leaf."
    - "Many questions. Few results. Classic corporate behavior."
    - "I'm starting to think you're not really from corporate."

# Rate limiting configuration
rate_limits:
  prompts_per_minute: 10
  flags_per_minute: 5
  similarity_threshold: 0.85
  bruteforce_window_seconds: 60

# Anti-abuse settings
abuse_detection:
  min_prompt_length: 10
  max_prompt_length: 120
  max_context_length: 2000
  repeated_similarity_threshold: 3
